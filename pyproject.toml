[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mscomputer-miner"
version = "0.2.1"
description = "Ms. Computer SN24 miner"
readme = "README.md"
license = "LicenseRef-MsComputer-Miner"
requires-python = "==3.12.*"
dependencies = [
  "bittensor==11.1.0",
  "cryptography==50.0.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[project.scripts]
mscomputer-miner = "mscomputer_subnet.miner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mscomputer_subnet"]

[tool.hatch.build.targets.wheel.force-include]
"pkg/netpolicy/iana-special-purpose.v1.json" = "mscomputer_subnet/iana-special-purpose.v1.json"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["ASYNC109", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mscomputer_subnet"]
warn_unreachable = true
